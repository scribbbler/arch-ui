name: Deploy Docs & Storybook

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:build

      - name: Build docs
        run: pnpm --filter @arch-ui/docs build
        env:
          DOCS_URL: https://scribbbler.github.io
          DOCS_BASE_URL: /arch-ui/

      - name: Build storybook
        run: pnpm --filter @arch-ui/storybook build
        env:
          STORYBOOK_BASE_PATH: /arch-ui/storybook/

      - name: Combine outputs
        run: |
          mkdir -p _site
          cp -r apps/docs/build/* _site/
          mkdir -p _site/storybook
          cp -r apps/storybook/storybook-static/* _site/storybook/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
